[build]
  command = "cd backend && npm install && npx prisma generate && cd ../frontend && npm install && npm run build"
  publish = "frontend/dist"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", ".prisma"]

[functions.api]
  included_files = ["backend/node_modules/.prisma/**", "backend/prisma/schema.prisma"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
